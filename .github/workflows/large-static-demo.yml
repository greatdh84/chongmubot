# 대모임(large/) 정적 데모판 자동 갱신 — 채총 작성, 공용 영역(도총 확인 필요)
# main 에 large/** 변경이 push 되면 demo/large/(GitHub Pages 의 워크샵 → 대모임 화면)를 다시 만들어 커밋한다.
# Pages 배포 설정(브랜치 배포)은 그대로 두고, 이 워크플로는 저장소 파일만 갱신한다.
name: 대모임 정적 데모판 갱신

on:
  push:
    branches: [main]
    paths:
      - "large/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: large-static-demo
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: hub/requirements.txt

      - name: 파이썬 의존성
        run: pip install -r hub/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: large/frontend/package-lock.json

      - name: 정적 데모판 다시 만들기
        env:
          PYTHON: python
        run: large/scripts/update_static_demo.sh

      # 녹화 시각은 시드 기준일로 고정돼 있어 코드·데이터가 같으면 파일도 같다 → 바뀐 게 없으면 커밋하지 않음
      - name: 바뀌었으면 main 에 커밋
        run: |
          if [ -z "$(git status --porcelain -- demo/large)" ]; then
            echo "demo/large 변경 없음"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A demo/large
          git commit -m "chore: 대모임 정적 데모판 갱신 [skip ci]"
          git push
